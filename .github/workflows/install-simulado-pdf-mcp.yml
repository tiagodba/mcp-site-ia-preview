name: Instalar PDF MCP nos simulados GCM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-simulado-pdf-mcp.yml'
      - 'simulado-pdf-mcp.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carregar gerador de PDF nos simulados
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path(f'simulado-gcm-paracatu-reta-final-{n:02d}.html') for n in range(1,5)]
          tag = '<script src="/simulado-pdf-mcp.js"></script>'
          for p in files:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if tag not in text:
                  text = text.replace('</body>', tag + '</body>')
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulado-gcm-paracatu-reta-final-*.html
          git commit -m "feat: habilitar PDF de correção nos simulados GCM"
          git push
