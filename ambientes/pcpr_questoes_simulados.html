<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PCPR Agente — Questões e Simulados</title><style>:root{--n:#071A2B;--b:#1269B0;--c:#35C2DA;--g:#F2B544;--o:#F1793A}*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#eef5f8;color:#132b3a}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:28px}main{max-width:1000px;margin:auto;padding:22px}button,select{padding:10px 14px;border:0;border-radius:9px;margin:4px;cursor:pointer}button{background:var(--b);color:#fff}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #071a2b1a}.tag{color:var(--b);font-weight:bold}.opts button{background:#e7f1f6;color:#102b3b;border:1px solid #b8d2df}.ok{border-left:6px solid #25a56a}.bad{border-left:6px solid var(--o)}#feedback{padding:14px;border-radius:10px;margin-top:12px;background:#f5f8fa}.bar{height:10px;background:#d9e7ee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}small{opacity:.8}</style><header><h1>PCPR Agente — Questões e Simulados</h1><p>Ambiente MCP • questões comentadas e 4 simulados • atualização 22/08/2026</p></header><main><div class="card"><select id="sim"><option value="all">Banco completo</option><option value="0">Simulado 1</option><option value="1">Simulado 2</option><option value="2">Simulado 3</option><option value="3">Simulado 4</option></select><button onclick="start()">Iniciar</button><button onclick="resetAll()">Recomeçar</button><p id="status"></p><div class="bar"><i id="bar"></i></div></div><div id="q" class="card"></div></main><script>const base=[["Processo Penal", "Denúncia anônima, sozinha, autoriza automaticamente ingresso domiciliar.", "Errado", "Exigem-se fundadas razões concretas, justificadas posteriormente."], ["Constitucional", "Apreensão física de celular e acesso aos dados são atos juridicamente idênticos.", "Errado", "Tema 977 exige distinção entre os atos."], ["Penal", "O Tema 506 legalizou indistintamente todas as drogas.", "Errado", "A tese possui objeto e limites específicos ligados à cannabis para uso pessoal."], ["Administrativo", "Revogação corrige vício de legalidade de ato inválido.", "Errado", "Vício de legalidade conduz à anulação; revogação envolve mérito de ato válido."], ["Processo Penal", "Resultado positivo de busca sempre supre falta de fundada suspeita anterior.", "Errado", "A legalidade é aferida com base nos elementos anteriores à diligência."], ["Direitos Humanos", "Direitos fundamentais podem orientar interpretação da atividade investigativa.", "Certo", "Devido processo, privacidade e não autoincriminação limitam diligências."], ["Institucional", "A polícia judiciária atua exclusivamente após o oferecimento da denúncia.", "Errado", "Sua função investigativa é tipicamente pré-processual, sem essa exclusividade temporal."], ["Prova", "A quebra de cadeia de custódia produz sempre a mesma consequência.", "Errado", "A consequência depende da falha concreta, confiabilidade e demais elementos."], ["Jurisprudência", "Súmula vinculante e notícia institucional possuem a mesma força jurídica.", "Errado", "Notícia divulga; súmula vinculante possui regime constitucional próprio."], ["RLM", "Negar “todos os agentes foram aprovados” resulta em “ao menos um agente não foi aprovado”.", "Certo", "É a negação correta do quantificador universal."]];let list=[],i=0,hits=0;function start(){let s=document.querySelector('#sim').value;list=s==='all'?[...base]:[...base,...base].filter((_,k)=>k%4==+s).slice(0,5);i=0;hits=0;show()}function show(){if(i>=list.length){q.innerHTML=`<h2>Resultado: ${hits}/${list.length}</h2><p>Revise os comentários e refaça o bloco com menor desempenho.</p>`;status.textContent='Simulado concluído';bar.style.width='100%';return}let x=list[i];status.textContent=`Questão ${i+1} de ${list.length} • acertos: ${hits}`;bar.style.width=(i/list.length*100)+'%';q.className='card';q.innerHTML=`<div class=tag>${x[0]}</div><h2>${x[1]}</h2><div class=opts><button onclick="ans('Certo')">Certo</button><button onclick="ans('Errado')">Errado</button></div><div id=feedback hidden></div>`}function ans(a){let x=list[i],ok=a===x[2];if(ok)hits++;q.className='card '+(ok?'ok':'bad');feedback.hidden=false;feedback.innerHTML=`<b>${ok?'Correto':'Incorreto'} — Gabarito: ${x[2]}</b><p>${x[3]}</p><button onclick="next()">Próxima</button>`;document.querySelectorAll('.opts button').forEach(b=>b.disabled=true)}function next(){i++;show()}function resetAll(){start()}start()</script></html>
