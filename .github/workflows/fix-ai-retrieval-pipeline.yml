name: Fix MCP AI syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-retrieval-pipeline.yml'

permissions:
  contents: write

jobs:
  patch-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid newline inside JS string
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/dica.js')
          s = p.read_text(encoding='utf-8')
          broken = 'tavilyContext = snippets.slice(0, aprofundado ? 6 : 3).join("\n\n").slice(0, aprofundado ? 9000 : 4500);'
          # The previous workflow accidentally wrote a literal line break inside the quoted JS string.
          literal_broken = 'tavilyContext = snippets.slice(0, aprofundado ? 6 : 3).join("' + '\n\n' + '").slice(0, aprofundado ? 9000 : 4500);'
          fixed = 'tavilyContext = snippets.slice(0, aprofundado ? 6 : 3).join("\\n\\n").slice(0, aprofundado ? 9000 : 4500);'
          if fixed in s:
              print('Syntax already fixed')
          elif literal_broken in s:
              s = s.replace(literal_broken, fixed, 1)
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('Broken Tavily join string not found')
          PY
      - name: Validate JavaScript syntax
        run: node --check api/dica.js
      - name: Commit syntax fix
        run: |
          if git diff --quiet -- api/dica.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/dica.js
          git commit -m "Corrige sintaxe da API da IA MCP"
          git push
