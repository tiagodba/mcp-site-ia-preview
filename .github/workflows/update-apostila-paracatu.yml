name: Atualizar apostila GCM Paracatu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-apostila-paracatu.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir PDF
        run: |
          cat .pdf-update/part_* | base64 --decode > Apostila_Reta_Final_GCM_Paracatu_WEB.pdf
          test "$(stat -c%s Apostila_Reta_Final_GCM_Paracatu_WEB.pdf)" -gt 3000000
      - name: Publicar arquivo no repositório
        run: |
          git config user.name "MCP Atualizações"
          git config user.email "actions@users.noreply.github.com"
          git add Apostila_Reta_Final_GCM_Paracatu_WEB.pdf
          git rm -r .pdf-update .github/workflows/update-apostila-paracatu.yml
          git commit -m "feat: atualiza apostila GCM Paracatu 2026"
          git push
