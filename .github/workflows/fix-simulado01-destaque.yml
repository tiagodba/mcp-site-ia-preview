name: Corrigir destaque Questão 1 Simulado 01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-simulado01-destaque.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir enunciado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('simulado-gcm-paracatu-reta-final-01.html')
          text=p.read_text(encoding='utf-8')
          old='Leia: “Embora a norma fosse clara, parte dos candidatos interpretou-a apressadamente e, por isso, errou a questão.” As expressões destacadas estabelecem, respectivamente:'
          new='Leia: “Embora a norma fosse clara, parte dos candidatos interpretou-a apressadamente e, por isso, errou a questão.” As expressões “Embora” e “por isso” estabelecem, respectivamente:'
          if old not in text:
              raise SystemExit('Trecho original não encontrado')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulado-gcm-paracatu-reta-final-01.html
          git commit -m "fix: explicitar expressões da questão 1 do Simulado 01"
          git push
