<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cadeia de Custódia — Questões e Simulados</title><style>:root{--n:#071A2B;--b:#1269B0;--c:#35C2DA;--g:#F2B544;--o:#F1793A}*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#eef5f8;color:#132b3a}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:28px}main{max-width:1000px;margin:auto;padding:22px}button,select{padding:10px 14px;border:0;border-radius:9px;margin:4px;cursor:pointer}button{background:var(--b);color:#fff}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #071a2b1a}.tag{color:var(--b);font-weight:bold}.opts button{background:#e7f1f6;color:#102b3b;border:1px solid #b8d2df}.ok{border-left:6px solid #25a56a}.bad{border-left:6px solid var(--o)}#feedback{padding:14px;border-radius:10px;margin-top:12px;background:#f5f8fa}.bar{height:10px;background:#d9e7ee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}small{opacity:.8}</style><header><h1>Cadeia de Custódia — Questões e Simulados</h1><p>Ambiente MCP • questões comentadas e 4 simulados • atualização 22/08/2026</p></header><main><div class="card"><select id="sim"><option value="all">Banco completo</option><option value="0">Simulado 1</option><option value="1">Simulado 2</option><option value="2">Simulado 3</option><option value="3">Simulado 4</option></select><button onclick="start()">Iniciar</button><button onclick="resetAll()">Recomeçar</button><p id="status"></p><div class="bar"><i id="bar"></i></div></div><div id="q" class="card"></div></main><script>const base=[["CPP", "A cadeia de custódia começa apenas com a coleta do vestígio.", "Errado", "Começa com o reconhecimento, seguindo até o descarte, conforme art. 158-A e etapas do art. 158-B."], ["Digital", "O hash, isoladamente, comprova autoria e veracidade do conteúdo.", "Errado", "O hash auxilia a demonstrar integridade comparativa; não prova autoria nem licitude."], ["Jurisprudência", "Toda quebra da cadeia gera nulidade automática.", "Errado", "O STJ rejeita automatismo e exige análise concreta; falhas graves podem tornar a prova imprestável."], ["CPP", "A coleta é preferencialmente realizada por perito oficial.", "Certo", "É a literalidade do art. 158-C; preferencialmente não equivale a exclusivamente."], ["Digital", "Dúvida razoável sobre autenticidade pode exigir perícia complementar.", "Certo", "AgRg no HC 1.014.212/ES, STJ, 2026."], ["Biologia", "Itens biológicos distintos devem ser individualizados para reduzir contaminação cruzada.", "Certo", "Individualização e documentação protegem integridade e rastreabilidade."], ["Conceitos", "Vestígio, evidência e prova são sinônimos perfeitos.", "Errado", "A doutrina diferencia material bruto, interpretação técnico-científica e elemento incorporado ao processo."], ["Balística", "É recomendável introduzir objeto no cano da arma para verificar obstrução antes da perícia.", "Errado", "Isso pode alterar marcas e contaminar o vestígio."], ["CPP", "A central de custódia deve controlar entrada, saída e acesso aos vestígios.", "Certo", "O controle documentado é núcleo dos arts. 158-E e 158-F."], ["Digital", "Print isolado sempre equivale à extração integral e auditável.", "Errado", "Print é representação parcial e pode carecer de metadados e contexto."]];let list=[],i=0,hits=0;function start(){let s=document.querySelector('#sim').value;list=s==='all'?[...base]:[...base,...base].filter((_,k)=>k%4==+s).slice(0,5);i=0;hits=0;show()}function show(){if(i>=list.length){q.innerHTML=`<h2>Resultado: ${hits}/${list.length}</h2><p>Revise os comentários e refaça o bloco com menor desempenho.</p>`;status.textContent='Simulado concluído';bar.style.width='100%';return}let x=list[i];status.textContent=`Questão ${i+1} de ${list.length} • acertos: ${hits}`;bar.style.width=(i/list.length*100)+'%';q.className='card';q.innerHTML=`<div class=tag>${x[0]}</div><h2>${x[1]}</h2><div class=opts><button onclick="ans('Certo')">Certo</button><button onclick="ans('Errado')">Errado</button></div><div id=feedback hidden></div>`}function ans(a){let x=list[i],ok=a===x[2];if(ok)hits++;q.className='card '+(ok?'ok':'bad');feedback.hidden=false;feedback.innerHTML=`<b>${ok?'Correto':'Incorreto'} — Gabarito: ${x[2]}</b><p>${x[3]}</p><button onclick="next()">Próxima</button>`;document.querySelectorAll('.opts button').forEach(b=>b.disabled=true)}function next(){i++;show()}function resetAll(){start()}start()</script></html>
