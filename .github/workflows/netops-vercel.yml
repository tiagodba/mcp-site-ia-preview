name: Deploy NetOps Academy to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'netops-academy/**'
      - '.github/workflows/netops-vercel.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netops-academy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link existing Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "team_fdHNZxYPYGsfj1JiLA5AT26J",
            "projectId": "prj_gdqEpFQrLmguRLmTXD1anRUBnRdZ"
          }
          JSON

      - name: Deploy production
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
