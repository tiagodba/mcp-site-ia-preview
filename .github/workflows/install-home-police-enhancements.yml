name: Install MCP Police Home Enhancements
on:
  push:
    branches: [main]
    paths:
      - 'home-police-enhancements.js'
      - 'question-discipline-fix.js'
      - '.github/workflows/install-home-police-enhancements.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject MCP home enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          home='<script src="/home-police-enhancements.js"></script>'
          fix='<script src="/question-discipline-fix.js?v=20260817-1"></script>'
          if home not in s:
              s=s.replace('</body>',home+'\n</body>')
          pattern=r'<script src="/question-discipline-fix\.js(?:\?[^\"]*)?"></script>'
          if re.search(pattern,s):
              s=re.sub(pattern,fix,s,count=1)
          else:
              s=s.replace('</body>',fix+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ativa filtro de matéria na Central de Questões MCP"
          git push
